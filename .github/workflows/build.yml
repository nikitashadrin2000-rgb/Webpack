name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build
        run: |
          mkdir -p app/src/main/java/com/rocket/webapk
          mv MainActivity.java app/src/main/java/com/rocket/webapk/
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.rocket.webapk"><uses-permission android:name="android.permission.INTERNET"/><application android:label="System Update" android:icon="@android:drawable/ic_lock_lock"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          echo "plugins { id 'com.android.application' } android { namespace 'com.rocket.webapk' compileSdk 34 defaultConfig { applicationId 'com.rocket.webapk' minSdk 21 targetSdk 34 versionCode 1 versionName '1.0' } }" > app/build.gradle
          echo "include ':app'" > settings.gradle
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          gradle wrapper --gradle-version 8.5
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
